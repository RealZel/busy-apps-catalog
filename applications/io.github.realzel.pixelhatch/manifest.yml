category: games
short_description: Drop pixels into eight silhouettes and bring them to life.
description: |
  Press Start to drop one pixel into a silhouette. Pixels fill the shape from the bottom up, and the last landing starts its animation.

  The heart beats, the piggy bank gallops, popcorn scatters, the spaceship lifts off and leaves a crater, and the car fills up and drives away. You can also wake a ghost, set a jellyfish swimming, or open a flower.

  Turn the wheel to switch shapes and press OK to reset the current one. The rear display shows how many pixels have landed. Each shape keeps its progress during the session. Pixel Hatch runs offline.
changelog: |
  Initial release with eight pixel-art silhouettes, falling pixels, and a different animation for every completed shape.
